<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗數排盤 - Ziwei Chart</title>
<!-- es-module-shims: 舊瀏覽器 importmap 相容 -->
<script async src="https://esm.sh/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "iztro": "https://esm.sh/iztro@2.5.1",
    "iztro-fallback": "https://esm.run/iztro@2.5.1",
    "iztro-fallback2": "https://cdn.jsdelivr.net/npm/iztro@2.5.1/+esm"
  }
}
</script>
<script>
// CDN 載入失敗即時提示
window.addEventListener('error', function(e){
  if(e.filename && (e.filename.includes('esm.sh') || e.filename.includes('esm.run') || e.filename.includes('iztro'))){
    var b=document.getElementById('errorBox');
     if(b){ b.textContent='排盤引擎好像連不上線，幫我檢查一下網路後再重新整理看看，已經幫你試過備援線路囉，稍後再試也沒問題。'; b.style.display='block'; }
  }
});
</script>
<style>
  :root{
    --bg:#f9f5eb;--paper:#fffef7;--border:#d4c5a0;--red:#8b1a1a;--red2:#a52a2a;--gold:#c9a86a;--ink:#2c1810;
    --purple:#6d28d9;--green:#047857;--scarlet:#dc2626;--muted:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Serif TC","Microsoft JhengHei",serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:linear-gradient(135deg,var(--red) 0%, #5a0f0f 100%);color:#fff;padding:22px 16px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25);position:relative;overflow:hidden}
  header::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.12),transparent 60%)}
  header h1{font-size:26px;letter-spacing:8px;position:relative;z-index:1}
  header p{font-size:13px;opacity:.85;margin-top:6px;letter-spacing:2px;position:relative;z-index:1}
  .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
  .card{background:var(--paper);border:1.5px solid var(--border);border-radius:14px;box-shadow:0 6px 24px rgba(44,24,16,.08);overflow:hidden}
  .card-head{background:linear-gradient(to right,#fdf6e3,#fffef7);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px}
  .card-head .dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
  .card-head h2{font-size:15px;letter-spacing:3px;color:var(--red)}
  .form-body{padding:18px;display:grid;grid-template-columns:repeat(8, minmax(0,1fr));gap:10px;align-items:end}
  .form-body .field-cb{padding-top:0;align-self:center;justify-content:center}
  .field label{display:block;font-size:12px;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid #d9c9a3;border-radius:8px;background:#fff;font-size:14px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,106,.2)}
  .field-cb{display:flex;align-items:center;gap:8px;padding-top:22px}
  .actions{padding:0 18px 18px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:10px 22px;border-radius:10px;border:none;font-size:14px;letter-spacing:2px;cursor:pointer;transition:.2s}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(139,26,26,.3)}
  .btn-primary:hover{background:#6e1515;transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--ink)}
  .btn-ghost:hover{background:#fdf6e3}
  .hint{font-size:12px;color:var(--muted);padding:0 18px 14px}
  .error{margin:0 18px 12px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;font-size:13px;display:none}
  /* chart */
  .chart-wrap{margin-top:22px;display:none}
  .chart-wrap.show{display:block}
  .board{--gap:3px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(138px,auto));gap:var(--gap);background:var(--border);border:2.5px solid var(--border);border-radius:14px;overflow:hidden}
  .palace{background:var(--paper);padding:10px 10px 8px;position:relative;display:flex;flex-direction:column;min-height:138px}
  .palace .p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;border-bottom:1px dashed #e7dbc0;padding-bottom:5px}
  .p-name{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--red)}
  .p-branch{font-size:11px;color:var(--muted);background:#fdf6e3;border:1px solid #e7dbc0;padding:1px 6px;border-radius:20px}
  .p-stemBranch{font-size:11px;color:#92400e;text-align:right;margin-bottom:4px}
  .stars{flex:1}
  .star-group{margin-bottom:4px}
  .star{display:inline-block;margin:2px 3px 2px 0;padding:1px 5px;border-radius:4px;font-size:12px;line-height:1.6;border:1px solid transparent}
  .star-major{background:#f5f0ff;border-color:#ddd6fe;color:var(--purple);font-weight:700}
  .star-minor{background:#ecfdf5;border-color:#a7f3d0;color:var(--green)}
  .star-adjoint{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
  .star-evil{background:#fef2f2;border-color:#fecaca;color:var(--scarlet);font-weight:700}
  .si-hua{display:inline-block;font-size:10px;padding:0 3px;border-radius:3px;margin-left:2px;font-weight:800;color:#fff}
  .h-lu{background:#16a34a}.h-quan{background:#2563eb}.h-ke{background:#7c3aed}.h-ji{background:#dc2626}
  .p-foot{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;font-size:10px;color:var(--muted)}
  .p-foot span{background:#fdf6e3;border:1px solid #e7dbc0;padding:1px 4px;border-radius:4px}
  .center{grid-column:2 / span 2;grid-row:2 / span 2;background:radial-gradient(ellipse at center,#fffef7 30%,#fdf6e3 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;border:2px solid var(--gold)}
  .center h3{font-size:18px;letter-spacing:6px;color:var(--red);margin-bottom:6px}
  .center .meta{font-size:12px;color:var(--ink);line-height:1.9}
  .center .meta b{color:var(--red)}
  .center .ganZhi{margin-top:8px;font-size:11px;color:var(--muted);background:#fff;padding:6px 10px;border-radius:8px;border:1px solid #e7dbc0}
  .empty-note{color:var(--muted);font-size:11px;font-style:italic}
  /* detail */
  .detail{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .detail-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .detail-card h4{font-size:13px;color:var(--red);border-bottom:1px solid #f0e6cc;padding-bottom:6px;margin-bottom:8px;letter-spacing:1px}
  .detail-card ul{list-style:none;font-size:12px;line-height:1.9}
  .detail-card li{border-bottom:1px dotted #f0e6cc;padding:2px 0}
  .legend{margin-top:14px;font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.1)}
  .fortune{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .fortune-card{background:var(--paper);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(44,24,16,.06)}
  .fortune-head{padding:12px 14px;font-size:13px;font-weight:800;letter-spacing:2px;color:#fff;display:flex;align-items:center;gap:8px}
  .fortune-head.yearly{background:linear-gradient(135deg,#8b1a1a,#c2410c)}
  .fortune-head.career{background:linear-gradient(135deg,#1e40af,#0e7490)}
  .fortune-head.love{background:linear-gradient(135deg,#be185d,#7c3aed)}
  .fortune-head.wealth{background:linear-gradient(135deg,#a16207,#ca8a04)}
  .fortune-head.monthly{background:linear-gradient(135deg,#065f46,#0e7490)}
  .fortune-body{padding:14px;font-size:12.5px;line-height:1.9}
  .fortune-body b{color:var(--red)}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid #e7dbc0;background:#fdf6e3;margin:2px 3px 2px 0}
  .tag-hl{background:#fef2f2;border-color:#fecaca;color:#dc2626;font-weight:700}
  .progress{height:6px;background:#f3e8c9;border-radius:999px;overflow:hidden;margin:6px 0}
  .progress i{display:block;height:100%;border-radius:999px}
  @media(max-width:760px){
    .form-body{grid-template-columns:repeat(4, minmax(0,1fr));gap:8px}
    .board{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(105px,auto));gap:2px}
    .palace{min-height:105px;padding:6px 6px 5px}
    .palace .p-name{font-size:11px}
    .palace .p-branch{font-size:9px}
    .p-stemBranch{font-size:10px}
    .star{font-size:10px;padding:1px 3px}
    .center{grid-column:2 / span 2;grid-row:2 / span 2}
    header h1{letter-spacing:4px;font-size:20px}
  }
  @media(max-width:480px){
    .form-body{grid-template-columns:repeat(2, minmax(0,1fr));gap:8px}
    .board{gap:2px}
    .palace{min-height:92px}
    .center h3{font-size:15px;letter-spacing:4px}
    .center .meta{font-size:11px}
  }
  .star.has-tip{position:relative;cursor:help}
  .star.has-tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100%+6px);transform:translateX(-50%);background:#2c1810;color:#fffef7;padding:6px 8px;border-radius:6px;font-size:11px;line-height:1.6;white-space:normal;max-width:220px;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none}
  .star.has-tip:hover::after,.star.has-tip.show-tip::after{display:block}
  .star.has-tip::before{content:"";position:absolute;left:50%;bottom:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2c1810;display:none}
  .star.has-tip:hover::before,.star.has-tip.show-tip::before{display:block}
  @media print{header,.card{break-inside:avoid} .btn{display:none}}
</style>
</head>
<body>
<header>
  <h1>紫微斗數命盤</h1>
  <p>輸入出生時間，馬上排出你的專屬命盤，十二宮的故事一次說給你聽</p>
</header>

<div class="wrap">
  <div class="card" id="inputCard">
    <div class="card-head"><span class="dot"></span><h2>出生資訊</h2><span style="margin-left:auto;font-size:11px;color:var(--muted)">不管國曆或農曆，系統都會自動幫你換好</span></div>
    <div class="form-body">
      <div class="field"><label>性別</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
      <div class="field"><label>曆法</label><select id="calType"><option value="solar">國曆（陽曆）</option><option value="lunar">農曆（陰曆）</option></select></div>
      <div class="field"><label>出生年</label><input id="year" type="number" min="1900" max="2100" value="2000"></div>
      <div class="field"><label>月</label><select id="month"></select></div>
      <div class="field"><label>日</label><select id="day"></select></div>
      <div class="field"><label>時（24小時制）</label><select id="hour"></select></div>
      <div class="field"><label>分</label><select id="minute"></select></div>
      <div class="field-cb"><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" id="isLeap"> 閏月（僅農曆）</label></div>
    </div>
    <div id="lunarDayHint" style="display:none;margin:0 18px 10px;padding:8px 10px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:8px;font-size:12px;line-height:1.6"></div>
    <div class="error" id="errorBox"></div>
    <div class="actions">
      <button class="btn btn-primary" id="btnCalc" disabled>載入中…</button>
      <button class="btn btn-ghost" id="btnSample">填入範例</button>
      <button class="btn btn-ghost" id="btnPrint" style="margin-left:auto">列印 / 存 PDF</button>
    </div>
    <div class="hint">※ 時辰小提醒：00:00-00:59 算早子、01:00-02:59 是丑時、03:00-04:59 是寅時⋯一路到 23:00-23:59 是晚子，選好時間系統就會自動幫你分好囉。分鐘只是做個紀錄，實際以整點區間為準。<br>※ 溫馨提醒：早子和晚子都算當天，八字日柱系統會自動處理好；如果和老師傅算的差一天，試試前後一天的日期，通常就對上囉。</div>
  </div>

  <div id="chartWrap" class="chart-wrap">
    <div class="board" id="board"></div>
    <div class="legend">
      <span><i style="background:#f5f0ff;border-color:#ddd6fe"></i> 十四主星</span>
      <span><i style="background:#ecfdf5"></i> 吉星</span>
      <span><i style="background:#fef2f2"></i> 煞星</span>
      <span><i style="background:#fff7ed"></i> 雜曜</span>
      <span><i style="background:#16a34a"></i> 祿</span>
      <span><i style="background:#2563eb"></i> 權</span>
      <span><i style="background:#7c3aed"></i> 科</span>
      <span><i style="background:#dc2626"></i> 忌</span>
    </div>
    <div class="detail" id="detail"></div>
    <div class="fortune" id="fortune"></div>
    <div id="flying"></div>
    <div id="compareHelp" style="margin-top:16px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;font-size:12px;line-height:1.8;display:none"></div>
  </div>
</div>

<script type="module">
let astro;
try{
  astro = (await import('iztro')).astro;
}catch(e){
  console.warn('esm.sh 載入失敗，嘗試備援 esm.run', e);
  try{
    astro = (await import('iztro-fallback')).astro;
  }catch(e2){
    console.warn('esm.run 載入失敗，嘗試備援 jsDelivr', e2);
    try{
      astro = (await import('iztro-fallback2')).astro;
    }catch(e3){
      const b=document.getElementById('errorBox');
       if(b){ b.textContent='排盤引擎目前連不上（esm.sh / esm.run / jsDelivr 都試過囉），先檢查一下網路再重新整理看看。'; b.style.display='block'; const r=document.createElement('button'); r.textContent='重新載入試試'; r.className='btn btn-ghost'; r.style.marginTop='8px'; r.onclick=()=>location.reload(); b.appendChild(document.createElement('br')); b.appendChild(r); const c=document.getElementById('btnCalc'); if(c){ c.textContent='載入失敗，點我重試'; c.disabled=false; c.onclick=()=>location.reload(); } }
      throw e3;
    }
  }
}
// 2-2 載入完成後啟用排盤按鈕
try{
  const btnCalcEl=document.getElementById('btnCalc');
  if(btnCalcEl && astro){ btnCalcEl.disabled=false; btnCalcEl.textContent='開始排盤'; }
}catch{}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const monthSel = $('#month'), daySel=$('#day'), hourSel=$('#hour'), minuteSel=$('#minute');

function fillSelects(){
  monthSel.innerHTML=''; for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i;o.textContent=i+' 月';monthSel.appendChild(o)}
  daySel.innerHTML=''; for(let i=1;i<=31;i++){let o=document.createElement('option');o.value=i;o.textContent=i+' 日';daySel.appendChild(o)}
  hourSel.innerHTML=''; for(let i=0;i<24;i++){let o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0')+' 時';hourSel.appendChild(o)}
  minuteSel.innerHTML=''; for(let i=0;i<60;i++){let o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0')+' 分';minuteSel.appendChild(o)}
  monthSel.value=8; daySel.value=16; hourSel.value=14; minuteSel.value=30;
}
fillSelects();
// 依年月動態調整日選單（解決 2月31日等無效日期 UX）- 農曆固定30日避免西曆截斷
function syncDays(){
  const y=parseInt($('#year').value,10)||2000;
  const m=parseInt(monthSel.value,10)||1;
  const curDay=parseInt(daySel.value,10)||1;
  const calTypeVal=$('#calType').value;
  const daysInMonth= calTypeVal==='lunar' ? 30 : new Date(y,m,0).getDate();
  const prevLen=daySel.options.length;
  if(prevLen!==daysInMonth){
    daySel.innerHTML='';
    for(let i=1;i<=daysInMonth;i++){let o=document.createElement('option');o.value=i;o.textContent=i+' 日';daySel.appendChild(o)}
  }
  // 若原選擇日超過當月天數，自動退至月末
  if(curDay>daysInMonth) daySel.value=daysInMonth;
  else daySel.value=curDay;
  updateLunarHint();
}
$('#year').addEventListener('change',syncDays);
$('#year').addEventListener('input',syncDays);
monthSel.addEventListener('change',syncDays);
$('#calType').addEventListener('change',syncDays);
daySel.addEventListener('change',updateLunarHint);
syncDays();

function updateLunarHint(){
  const hint=document.getElementById('lunarDayHint');
  if(!hint) return;
  const isLunar=$('#calType').value==='lunar';
  const d=parseInt(daySel.value,10);
  const btn=document.getElementById('btnCalc');
  // 若之前因小月30日被禁用，先嘗試恢復（待後續判斷是否需再次禁用）
  function restoreBtnIfLunarDisabled(){
    if(btn && btn.dataset.lunarDisabled==='1'){
      // 僅在 astro 已載入且按鈕是被本邏輯禁用時才恢復，避免覆蓋「載入中」禁用
      btn.disabled=false; btn.textContent='開始排盤'; delete btn.dataset.lunarDisabled;
    }
  }
  if(isLunar && d===30){
    // 嘗試以 iztro 試算判斷該農曆月是大月或小月（小月選30會拋 only 29 days）
    let isSmallMonth=false;
    if(typeof astro!=='undefined' && astro){
      try{
        const y=parseInt($('#year').value,10)||2000;
        const m=parseInt(monthSel.value,10)||1;
        const isLeap=$('#isLeap').checked;
        const pad2=n=>String(n).padStart(2,'0');
        // 用固定 timeIndex 7 測試，不影響實際排盤
        astro.byLunar(`${y}-${pad2(m)}-${pad2(d)}`, 7, '男', isLeap, true, 'zh-TW');
      }catch(e){
        if(/only\s*29\s*days/i.test(e.message||String(e))) isSmallMonth=true;
      }
    }
    if(isSmallMonth){
      hint.textContent='※ 溫馨提醒：這個農曆月是小月，只有 29 天，選 30 日會沒辦法排盤，已經先幫你把「開始排盤」暫停囉，改選 29 日再試試看。';
      hint.style.display='block';
      if(btn && typeof astro!=='undefined' && astro){ btn.disabled=true; btn.dataset.lunarDisabled='1'; }
    }else{
      restoreBtnIfLunarDisabled();
      hint.textContent='※ 小提醒：農曆小月只有 29 天，選到 30 日就會排不出來，改選 29 日就好；大月的話選 30 日就沒問題。';
      hint.style.display='block';
    }
  } else if(isLunar && d>=29){
    restoreBtnIfLunarDisabled();
    hint.textContent='※ 小提醒：選 29 日時，大月落在月中、小月落在月末，不用特別調整，放心選就好。';
    hint.style.display='block';
  } else {
    restoreBtnIfLunarDisabled();
    hint.style.display='none';
  }
}

// 農曆/國曆切換時禁用閏月選項
function syncLeap(){
  const isSolar = $('#calType').value==='solar';
  $('#isLeap').disabled = isSolar;
  $('#isLeap').parentElement.style.opacity = isSolar ? '0.4' : '1';
  if(isSolar) $('#isLeap').checked=false;
  updateLunarHint();
}
$('#calType').addEventListener('change', syncLeap);
document.getElementById('isLeap').addEventListener('change', updateLunarHint);
syncLeap();

$('#btnSample').addEventListener('click',()=>{
  $('#gender').value='男'; $('#calType').value='solar';
  $('#year').value=2000; monthSel.value=8; syncDays(); daySel.value=16; hourSel.value=14; minuteSel.value=30;
  $('#isLeap').checked=false;
  syncLeap();
});
$('#btnPrint').addEventListener('click',()=>window.print());

function getTimeIndex(hour){
  // 對齊 iztro@2.5.1 官方 CHINESE_TIME 定義（與下方 hint/getBranch 一致）
  // 0=早子(00:00-00:59), 1=丑(01:00-02:59), 2=寅(03:00-04:59), 3=卯(05:00-06:59), 4=辰(07:00-08:59), 5=巳(09:00-10:59), 6=午(11:00-12:59), 7=未(13:00-14:59), 8=申(15:00-16:59), 9=酉(17:00-18:59), 10=戌(19:00-20:59), 11=亥(21:00-22:59), 12=晚子(23:00-23:59)

}

function classifyStar(name){

function getStarBase(star){
  return starGlossary[star] || `「${star}」是輔助的小星曜，力量比較輕，主要幫同宮主星加分，單獨影響不大，建議一起參考主星和三方四正來看`;
}
function getStarTip(star, palace){
  const base = getStarBase(star);
  const pNorm = palace ? palace.replace('宫','宮').replace('禄','祿').replace('财','財').replace('仆','僕') : '';
  const eff = palaceEffects[pNorm] || palaceEffects[palace] || '';
  // 保留完整版（星曜解說＋宮位說明）供需要一次看懂時使用
  if(eff) return `${base}；在${pNorm||palace}，${eff}`;
  return base;
}

function mutagenClass(m){
  if(m.includes('祿')||m.includes('禄')) return 'h-lu';
  if(m.includes('權')||m.includes('权')) return 'h-quan';
  if(m.includes('科')) return 'h-ke';
  if(m.includes('忌')) return 'h-ji';
  return '';
}
const brightnessPlain={
  '廟':'能量最強','旺':'狀態很好','得':'很得力','利':'有點順','平':'平平穩穩','不':'有點弱','陷':'能量被困','閑':'比較閒弱','闲':'比較閒弱'
};
const mutagenPlain={
  '祿':'機會錢財','禄':'機會錢財','權':'掌握主導','权':'掌握主導','科':'名聲學習','忌':'課題牽絆'
};
function formatBrightness(b){
  if(!b) return '';
  const tip=brightnessPlain[b]||'亮度';
  return `(${esc(b)}·${esc(tip)})`;
}
function formatMutagenBracket(m){
  if(!m) return '';
  const tip=mutagenPlain[m]||'四化';
  return `【${esc(m)}·${esc(tip)}】`;
}
function formatMutagenStar(m){
  if(!m) return '';
  const tip=mutagenPlain[m]||'四化';
  return `<span class="si-hua ${mutagenClass(m)}" title="${esc(tip)}">${esc(m)}</span>`;
}

$('#btnCalc').addEventListener('click', ()=>{
  clearError();
  const gender=$('#gender').value;
  const calType=$('#calType').value;
  const y=parseInt($('#year').value,10), m=parseInt(monthSel.value,10), d=parseInt(daySel.value,10), h=parseInt(hourSel.value,10), minute=parseInt(minuteSel.value,10);
  const isLeap=$('#isLeap').checked;
  if(!y || y<1900 || y>2100) return showError('年份幫我填在 1900～2100 之間喔');
  // validate date — 僅國曆用 new Date 驗證，農曆交給 iztro 驗證（農曆 30 日、閏月用西曆 Date 會誤判）
  if(calType==='solar'){
    const test = new Date(y,m-1,d,h,minute);
    if(test.getMonth()!==m-1 || test.getDate()!==d) return showError('日期怪怪的，幫我檢查一下年月日對不對（像 2 月就沒有 30 號喔）');
  } else {
    if(m<1 || m>12 || d<1 || d>30) return showError('農曆日期好像不太對，幫我確認一下月份和日子');
  }
  const timeIndex=getTimeIndex(h);
  const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  let astrolabe;
  try{
    if(calType==='solar'){
      astrolabe = astro.bySolar(dateStr, timeIndex, gender, true, 'zh-TW');
    }else{
      // 修正：byLunar 參數順序為 (date, timeIndex, gender, isLeapMonth, fixLeap, language)
      // 之前誤將 isLeap 放在 language 位置
      astrolabe = astro.byLunar(dateStr, timeIndex, gender, isLeap, true, 'zh-TW');
    }
  }catch(e){
    console.error(e);
    // 2-3 中文化：iztro 農曆小月 30 日會拋 "only 29 days"
    let rawMsg = e.message || String(e);
    if(/only\s*29\s*days/i.test(rawMsg)){
      rawMsg = '這個農曆月是小月，只有 29 天，幫我改選 29 日再試試看（大月才有 30 日喔）';
    }
    return showError('排盤沒有成功：'+rawMsg+'，幫我確認一下日期和時辰再試一次看看');
  }
  if(!astrolabe || !astrolabe.palaces) return showError('排盤資料好像有點狀況，幫我檢查一下輸入內容再試一次看看');
  render(astrolabe, {gender, dateStr, h, minute, calType});
});

function render(astrolabe, info){
  const board=$('#board');

  // 直接依地支座標放置，避免依序 append 導致中心空隙錯位（Issue #4）
  for(const p of astrolabe.palaces){
    const div=document.createElement('div');
    div.className='palace';
    div.dataset.branch = p.earthlyBranch;
    div.dataset.palace = p.name;
    const g = posGrid[p.earthlyBranch];
    if(g){ div.style.gridColumn = g.col; div.style.gridRow = g.row; }
    // highlight 命宮 身宮
    const isMing = p.name==='命宮' || p.name==='命宫';
    const isShen = p.isBodyPalace;
    if(isMing) div.style.borderTop='3px solid var(--red)';
    if(isShen) div.style.background='#fff7ed';
    const starsHtml = (()=>{
      let html='';
      const allStars = [...(p.majorStars||[]),...(p.minorStars||[]),...(p.adjectiveStars||[]), ...(p.stars||[])];
      // 去重：同一顆星名只顯示一次（避免 p.stars 與 adjective 重疊，或流曜與本命同名）
      const seen=new Set(); const uniq=allStars.filter(s=>{const k=s.name; if(seen.has(k)) return false; seen.add(k); return true;});
      if(uniq.length===0) return '<span class="empty-note">暫無主星</span>';
      uniq.forEach(s=>{
        const cls=classifyStar(s.name);
        const mut=s.mutagen ? formatMutagenStar(s.mutagen) : '';
        const bright = s.brightness ? `<span style="font-size:10px;color:var(--muted)" title="${esc(brightnessPlain[s.brightness]||'')}">${formatBrightness(s.brightness)}</span>` : '';
        // 小祕訣：tooltip 只顯示星曜本身的個性，不再重複宮位說明，這樣每顆星 hover 內容都不一樣
        const tipRaw = getStarBase(s.name);
        const tip = tipRaw ? esc(tipRaw) : '';
        const tipCls = tip ? ' has-tip' : '';
        const tipAttr = tip ? ` data-tip="${tip}"` : '';
        html+=`<span class="star star-${cls}${tipCls}"${tipAttr}>${esc(s.name)}${mut}${bright}</span>`;
      });
      return html;
    })();
    const decadalInfo = p.decadal||p.stage;
    const minorInfo = `
      <div class="p-foot">
        ${p.isBodyPalace?'<span>身宮</span>':''}
        ${p.isOriginalPalace?'<span>來因</span>':''}
        <span>長生:${p.changsheng12||p.stageOfGrowth||'-'}</span>
        ${p.boshi12?'<span>博士:'+p.boshi12+'</span>':''}
        ${decadalInfo?'<span>大限:'+decadalInfo.range.join('~')+'</span>':''}
      </div>
    `;
    div.innerHTML=`
      <div class="p-head"><span class="p-name">${p.name}${isShen?'·身':''}</span><span class="p-branch">${p.earthlyBranch}宮</span></div>
      <div class="p-stemBranch">${p.heavenlyStem}${p.earthlyBranch} · ${p.fiveElement||''}</div>
      <div class="stars">${starsHtml}</div>
      ${minorInfo}
    `;
    board.appendChild(div);
  }
  // center div - 明確佔據 2x2 中央
  const center=document.createElement('div');
  center.className='center';
  // astrolabe fields: 分離 八字與農曆，避免顯示錯誤
  const chinDate = astrolabe.chineseDate || '';
  // 農曆輸入時 info.dateStr 為農曆，需改抓 astrolabe.solarDate 避免重複顯示
  const solarBase = (()=>{ try{ if(info.calType==='lunar' && astrolabe.solarDate) return typeof astrolabe.solarDate==='string' ? astrolabe.solarDate : String(astrolabe.solarDate); if(astrolabe.solarDate && typeof astrolabe.solarDate==='string') return astrolabe.solarDate; }catch{} return info.dateStr; })();
  const solarStr = `${solarBase} ${String(info.h).padStart(2,'0')}:${String(info.minute).padStart(2,'0')} (${getBranch(info.h)}時)`;
  const lunarStr = (()=>{ try{ return astrolabe.lunarDate || '' }catch{return ''}})();
  // 八字四柱：優先取 rawDates.chineseDate 或 astrolabe.solarDate 對應的四柱，兼容不同版本欄位
  const raw = astrolabe.rawDates?.chineseDate || astrolabe.chineseDate;
  let bzStr = '';
  try{
    if(astrolabe.fourPillars){
      const fp=astrolabe.fourPillars;
      if(typeof fp==='string') bzStr=fp;
      else if(Array.isArray(fp)) bzStr=fp.join(' ');
      else if(fp.yearly && fp.monthly && fp.daily && fp.hourly) bzStr=`${fp.yearly.join('')} ${fp.monthly.join('')} ${fp.daily.join('')} ${fp.hourly.join('')}`;
      else bzStr=Object.values(fp).map(v=>Array.isArray(v)?v.join(''):String(v)).join(' ');
    } else if(raw && typeof raw==='object' && raw.yearly) bzStr = `${raw.yearly.join('')} ${raw.monthly.join('')} ${raw.daily.join('')} ${raw.hourly.join('')}`;
    else if(typeof raw==='string') bzStr = raw;
    else bzStr = String(chinDate||'');
  }catch{ bzStr = String(chinDate||''); }
  const ju = astrolabe.fiveElementsClass || astrolabe.fiveElementClass || '';
  const soul = astrolabe.earthlyBranchOfSoulPalace || astrolabe.soul || '';
  const body = astrolabe.earthlyBranchOfBodyPalace || astrolabe.body || '';
  const starsCount = astrolabe.palaces.reduce((a,p)=>{ const all=[...(p.majorStars||[]),...(p.minorStars||[]),...(p.adjectiveStars||[]),...(p.stars||[])]; const s=new Set(all.map(x=>x.name)); return a+s.size; },0);
  center.innerHTML=`

      <div style="font-size:11px;color:var(--muted)">農曆 ${esc(lunarStr || chinDate)} · 生肖 ${esc(astrolabe.zodiac||'')}</div>
    </div>
    <div class="ganZhi" title="八字四柱">${esc(bzStr)}</div>
    <div style="margin-top:8px;font-size:10px;color:var(--muted)">共 ${starsCount} 顆星曜 · 五行納音</div>
    <div style="margin-top:4px;font-size:10px;color:var(--muted)">排盤日期：${(() => { const d=new Date(); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; })()}</div>
  `;
  // we need to place center in grid: use manual grid placement
  center.style.gridColumn='2 / span 2';
  center.style.gridRow='2 / span 2';
  board.appendChild(center);
  // fix board to 4 columns - center will overlay; need to reorder: move center to be second row visually
  // ensure board has 16 children including center at end - grid auto places, but with span it works

  // detail cards
  const detail=$('#detail');
  detail.innerHTML='';
  astrolabe.palaces.forEach(p=>{
    const card=document.createElement('div');
    card.className='detail-card';
    // 修正：同步 board 的 p.stars 來源並去重，同一星名只留一次
    const allRaw = [...(p.majorStars||[]),...(p.minorStars||[]),...(p.adjectiveStars||[]),...(p.stars||[])];
    const seenDetail=new Set(); const all=allRaw.filter(s=>{const k=s.name; if(seenDetail.has(k)) return false; seenDetail.add(k); return true;});
    const starList = all.map(s=>`${esc(s.name)}${s.brightness?formatBrightness(s.brightness):''}${s.mutagen?formatMutagenBracket(s.mutagen):''}`).join('、') || '—';
      const decadalDetail = p.decadal||p.stage;
      card.innerHTML=`
      <h4>${p.name}（${p.heavenlyStem}${p.earthlyBranch}） ${p.isBodyPalace?'<span style="color:#c2410c">[身宮]</span>':''}</h4>
      <ul>
        <li><b>星曜：</b>${starList}</li>
        <li><b>干支：</b>${p.heavenlyStem}${p.earthlyBranch} · 長生:${p.changsheng12||'-'} · 博士:${p.boshi12||'-'}</li>
        <li><b>大限：</b>${decadalDetail? decadalDetail.range.join(' ~ ')+' 歲 · 天干:'+decadalDetail.heavenlyStem+' 地支:'+decadalDetail.earthlyBranch : '-'}</li>
        <li><b>小限：</b>${p.ages? p.ages.join(', ') : '-'}</li>
      </ul>
      <div style="margin-top:8px;padding-top:6px;border-top:1px dashed #e7dbc0;font-size:11px;line-height:1.7">
        <b>星曜小解讀（${esc(p.name)}）：</b><span style="color:var(--muted)"> ${esc(palaceEffects[p.name]||'')}</span><br>${all.length? all.map(s=>`• <b>${esc(s.name)}</b>：${esc(getStarBase(s.name))}${s.mutagen?formatMutagenBracket(s.mutagen):''}${s.brightness?formatBrightness(s.brightness):''}`).join('<br>') : '這宮目前是空宮，可以參考對宮和三方四正一起看'}

  renderFortune(astrolabe);

function renderFortune(astrolabe){
  const el=$('#fortune');
  const now=new Date();
  const y=now.getFullYear();
  // 修正：以當日實際日期計算流年，避免寫死 8-23
  const pad2=n=>String(n).padStart(2,'0');
  const dateStr=`${y}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;
  let h;
  try{ h=astrolabe.horoscope(dateStr); }catch(e){ el.innerHTML=`<div style="font-size:12px;color:#991b1b">流年計算失敗：${e.message}</div>`; return; }
  const yearly=h.yearly;
  const yearlyBranch=yearly.earthlyBranch;
  const yearlyStem=yearly.heavenlyStem;
  const yearlyPalace=astrolabe.palaces.find(p=>p.earthlyBranch===yearlyBranch);
  // 明年（維持同月同日，並處理 2/29 閏年邊界）
  const yNext=y+1;
  let nextMonth=now.getMonth()+1, nextDay=now.getDate();
  // 若明年該月無此日（例如今年 2/29 明年 2/28），自動退至月末
  const daysInNextMonth = new Date(yNext, nextMonth, 0).getDate();
  if(nextDay>daysInNextMonth) nextDay=daysInNextMonth;
  const nextDateStr=`${yNext}-${pad2(nextMonth)}-${pad2(nextDay)}`;
  let hNext; try{ hNext=astrolabe.horoscope(nextDateStr); }catch(e){ hNext=h; }
  const yearlyNext=hNext.yearly;
  const yearlyNextBranch=yearlyNext.earthlyBranch;
  const yearlyNextStem=yearlyNext.heavenlyStem;
  const yearlyNextPalace=astrolabe.palaces.find(p=>p.earthlyBranch===yearlyNextBranch);
  // 找出官祿與夫妻本命宮（兼容簡繁）
  const findPalace=(name)=> astrolabe.palaces.find(p=>p.name.includes(name.replace('祿','禄')) || p.name.includes(name) || p.name.includes(name.replace('禄','祿')));
  const careerPalace = findPalace('官祿') || findPalace('官禄') || astrolabe.palaces.find(p=>p.name.includes('官'));
  const lovePalace = findPalace('夫妻');
  // 流年對應的官祿/夫妻位置：兼容簡繁與不同 iztro 版本 palaceNames
  function findPalaceIndex(names, targets){
    if(!names) return -1;
    for(const t of targets){
      const idx=names.indexOf(t);
      if(idx>=0) return idx;
    }
    // 模糊匹配（忽略簡繁）
    for(let i=0;i<names.length;i++){
      if(targets.some(t=> names[i].includes(t) || t.includes(names[i]))) return i;
    }
    return -1;
  }
  const palaceOrderBranches=['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
  const yearlyCareerIdx = findPalaceIndex(yearly.palaceNames, ['官禄','官祿']);
  const yearlyLoveIdx = findPalaceIndex(yearly.palaceNames, ['夫妻']);
  const yearlyCareerPalace = yearlyCareerIdx>=0 ? astrolabe.palaces.find(p=>p.earthlyBranch===palaceOrderBranches[yearlyCareerIdx]) : null;
  const yearlyLovePalace = yearlyLoveIdx>=0 ? astrolabe.palaces.find(p=>p.earthlyBranch===palaceOrderBranches[yearlyLoveIdx]) : null;

  const mutagenTypes=['祿','權','科','忌'];
  const yearlyMutagenText = yearly.mutagen.map((n,i)=>`${n}化${mutagenTypes[i]||'?'}`).join('、');
  const yearlyNextMutagenText = yearlyNext.mutagen.map((n,i)=>`${n}化${mutagenTypes[i]||'?'}`).join('、');

  // 簡易評分：依主星吉凶給分 + 流年四化加成
  function scorePalace(p){
    if(!p) return 50;
    const all=[...(p.majorStars||[]),...(p.minorStars||[])];
    let s=60;
    all.forEach(st=>{
      if(['紫微','天府','太陽','太陰','天同','天梁'].some(k=>st.name.includes(k))) s+=8;
      if(['擎羊','陀羅','火星','鈴星','地空','地劫'].some(k=>st.name.includes(k))) s-=10;
      if(['左輔','右弼','文昌','文曲','天魁','天鉞'].some(k=>st.name.includes(k))) s+=5;
      if(st.mutagen==='祿'||st.mutagen==='禄') s+=7;
      if(st.mutagen==='忌') s-=7;
    });
    return Math.max(35,Math.min(95,s));
  }
  function scoreWithYearly(p, yearly){
    let s=scorePalace(p);
    if(!p || !yearly || !yearly.mutagen) return s;
    const stars=[...(p.majorStars||[]),...(p.minorStars||[]),...(p.adjectiveStars||[])].map(x=>x.name);
    const types=['祿','權','科','忌'];
    yearly.mutagen.forEach((star,idx)=>{
      if(stars.includes(star)){
        const t=types[idx];
        if(t==='祿') s+=8;
        else if(t==='權') s+=5;
        else if(t==='科') s+=3;
        else if(t==='忌') s-=9;
      }
    });
    // 流年祿存等小星額外
    return Math.max(35,Math.min(95,s));
  }
  const careerScore=scoreWithYearly(yearlyCareerPalace || careerPalace, yearly);
  const loveScore=scoreWithYearly(yearlyLovePalace || lovePalace, yearly);
  const yearlyScore=scoreWithYearly(yearlyPalace, yearly);
  const yearlyNextScore=scoreWithYearly(yearlyNextPalace, yearlyNext);

  function starsText(p){

          fliesHtml+= `<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #e7dbc0;font-size:11px;line-height:1.7">${srcIntro}${interpLines}</div>`;
        }catch(e){ fliesHtml=`<span style="color:#991b1b">計算失敗：${esc(e.message)}</span>`; }
        const palaceTags=`${p.isBodyPalace?'<span class="tag" style="background:#fff7ed;border-color:#fed7aa;color:#c2410c" title="身宮是一輩子最在意的地方">身宮</span>':''}${p.isOriginalPalace?'<span class="tag" style="background:#f0fdfa;border-color:#99f6e4;color:#0f766e" title="來因是這張盤的起點功課">來因</span>':''}`;
        html+=`<div class="flying-card" data-branch="${esc(p.earthlyBranch)}" style="background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px;transition:.2s">`
          +`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="font-weight:800;color:var(--red);font-size:13px">${esc(p.name)}（${esc(p.heavenlyStem)}${esc(p.earthlyBranch)}）</span><span style="font-size:11px;color:var(--muted)">${esc(p.fiveElement||'')} · ${esc(p.earthlyBranch)}宮</span><span style="margin-left:auto;display:flex;gap:4px">${palaceTags}</span></div>`
          +`<div style="font-size:12px;margin-bottom:6px"><b>這宮的星星：</b><span style="display:inline-flex;flex-wrap:wrap;gap:2px;vertical-align:middle">${allStarsHtml}</span></div>`
          +`<div style="font-size:12px;margin-bottom:6px"><b>一起幫忙的三方四正：</b><div style="margin-top:2px">${surroundHtml}</div></div>`
          +`<div style="font-size:12px"><b>四化飛去哪：</b>${fliesHtml||'—'}</div>`
          +`</div>`;
      });
      html+='</div></div>';
      el.innerHTML=html;
      // 綁定切換按鈕
      el.querySelectorAll('button[data-mode]').forEach(btn=>{
        btn.addEventListener('click',()=>renderGrid(btn.dataset.mode));
      });
      // hover 聯動：飛星行 hover 高亮對應地支宮位
      const boardPalaces=document.querySelectorAll('.palace[data-branch]');
      function clearHl(){ boardPalaces.forEach(x=>{ x.style.outline=''; x.style.boxShadow=''; }); el.querySelectorAll('.flying-card').forEach(c=>c.style.borderColor='var(--border)'); }
      el.querySelectorAll('.fly-line').forEach(line=>{
        line.addEventListener('mouseenter',()=>{
          const to=line.dataset.to; const from=line.dataset.from;
          clearHl();
          boardPalaces.forEach(x=>{
            if(x.dataset.branch===to || x.dataset.branch===from){ x.style.outline='2px solid var(--red)'; x.style.boxShadow='0 0 0 3px rgba(139,26,26,.15)'; }
          });
          const card=line.closest('.flying-card'); if(card) card.style.borderColor='var(--red)';
        });
        line.addEventListener('mouseleave', clearHl);
      });
      el.querySelectorAll('.flying-card').forEach(card=>{
        card.addEventListener('mouseenter',()=>{
          const br=card.dataset.branch;
          clearHl();
          boardPalaces.forEach(x=>{ if(x.dataset.branch===br) { x.style.outline='2px solid var(--gold)'; x.style.boxShadow='0 0 0 3px rgba(201,168,106,.2)'; }});
          card.style.borderColor='var(--gold)';
        });
        card.addEventListener('mouseleave', clearHl);
      });
    }
    renderGrid(currentMode);
    compareEl.style.display='block';
    // ── 詳細版：準備你這張盤的專屬對照資料 ──
    const genderVal = document.getElementById('gender')?.value || '';
    const calTypeVal = document.getElementById('calType')?.value || 'solar';
    const yearVal = document.getElementById('year')?.value || '';
    const monthVal = document.getElementById('month')?.value || '';
    const dayVal = document.getElementById('day')?.value || '';
    const hourVal = document.getElementById('hour')?.value || '';
    const minuteVal = document.getElementById('minute')?.value || '';
    const isLeapVal = document.getElementById('isLeap')?.checked ? '（閏月）' : '';
    const timeBranch = getBranch(parseInt(hourVal||0,10));
    const timeIndex = getTimeIndex(parseInt(hourVal||0,10));
    const solarDateStr = (()=>{ try{ if(astrolabe.solarDate) return typeof astrolabe.solarDate==='string'?astrolabe.solarDate:String(astrolabe.solarDate); }catch{} return `${yearVal}-${String(monthVal).padStart(2,'0')}-${String(dayVal).padStart(2,'0')}`; })();
    const lunarDateStr = (()=>{ try{ return astrolabe.lunarDate || astrolabe.chineseDate || ''; }catch{return ''}})();
    const yearlyStem = (astrolabe.rawDates?.chineseDate?.yearly?.[0] || bzStr.trim().charAt(0) || '');
    const yearlyFour = MUTAGEN_MAP[yearlyStem] || [];
    const mingPalace = astrolabe.palaces.find(p=>p.name==='命宮'||p.name==='命宫');
    const branchesOrder=['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
    const tableRows = branchesOrder.map(br=>{
      const pl=astrolabe.palaces.find(p=>p.earthlyBranch===br);
      if(!pl) return '';
      const majors=[...(pl.majorStars||[])].map(s=> s.mutagen? `${esc(s.name)}${formatMutagenBracket(s.mutagen)}${s.brightness?formatBrightness(s.brightness):''}` : `${esc(s.name)}${s.brightness?formatBrightness(s.brightness):''}`).join('、') || '<span style="color:var(--muted)">—（空宮）</span>';
      const minors=[...(pl.minorStars||[])].map(s=> s.mutagen? `${esc(s.name)}${formatMutagenBracket(s.mutagen)}` : esc(s.name)).join('、') || '—';
      const adj=[...(pl.adjectiveStars||[])].slice(0,3).map(s=>esc(s.name)).join('、') || '—';
      const tags=`${pl.isBodyPalace?'<span class="tag" style="background:#fff7ed;border-color:#fed7aa;color:#c2410c">身宮</span>':''}${pl.isOriginalPalace?'<span class="tag" style="background:#f0fdfa;border-color:#99f6e4;color:#0f766e">來因</span>':''}`;
      return `<tr data-branch="${esc(br)}" style="border-top:1px solid #f0e6cc">
        <td style="padding:6px 6px;white-space:nowrap"><label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" class="check-palace" style="accent-color:var(--red)"> <b>${esc(pl.name)}</b> ${tags}</label></td>
        <td style="padding:6px;text-align:center">${esc(pl.heavenlyStem)}${esc(pl.earthlyBranch)}<div style="font-size:10px;color:var(--muted)">${esc(br)}宮</div></td>
        <td style="padding:6px;font-size:11px">${majors}</td>
        <td style="padding:6px;font-size:11px">${minors}</td>
        <td style="padding:6px;font-size:11px;color:var(--muted)">${adj}</td>
      </tr>`;
    }).join('');
    const yearlyFourRows = yearlyFour.map((star,i)=>{
      let dest=null; try{ dest=astrolabe.star(star).palace(); }catch{}
      if(!dest) dest=astrolabe.palaces.find(pl=>[...(pl.majorStars||[]),...(pl.minorStars||[]),...(pl.adjectiveStars||[])].some(s=>s.name===star));
      const label=MUTAGEN_LABEL[i]; const color=MUTAGEN_COLOR[label];
      return `<span style="display:inline-flex;align-items:center;gap:4px;margin:3px 6px 3px 0;padding:2px 8px;border:1px solid #f0e6cc;border-radius:20px;background:#fff"><span style="color:${color};font-weight:800">${esc(star)}${esc(label)}</span><span style="color:var(--muted)">→</span><b>${dest?esc(dest.name):'—'}</b><span style="font-size:11px;color:var(--muted)">(${dest?esc(dest.earthlyBranch):'?'})</span></span>`;
    }).join('');
    const timeTableRows = [
      ['早子','00:00-00:59',0,'子','算當天'],['丑','01:00-02:59',1,'丑',''],['寅','03:00-04:59',2,'寅',''],['卯','05:00-06:59',3,'卯',''],['辰','07:00-08:59',4,'辰',''],['巳','09:00-10:59',5,'巳',''],['午','11:00-12:59',6,'午',''],['未','13:00-14:59',7,'未',''],['申','15:00-16:59',8,'申',''],['酉','17:00-18:59',9,'酉',''],['戌','19:00-20:59',10,'戌',''],['亥','21:00-22:59',11,'亥',''],['晚子','23:00-23:59',12,'子','算當天']
    ].map(([name,range,idx,branch,note])=>{
      const isCurrent= idx===timeIndex;
      return `<tr style="${isCurrent?'background:#fef3c7;font-weight:800':''}"><td style="padding:4px 6px;text-align:center">${esc(name)}</td><td style="padding:4px 6px;text-align:center;font-size:11px">${esc(range)}</td><td style="padding:4px 6px;text-align:center">${idx}</td><td style="padding:4px 6px;text-align:center">${esc(branch)}</td><td style="padding:4px 6px;font-size:11px;color:var(--muted)">${esc(note)}${isCurrent?' ← 你這張':''}</td></tr>`;
    }).join('');
    const copyText = `${yearVal}-${String(monthVal).padStart(2,'0')}-${String(dayVal).padStart(2,'0')} ${String(hourVal).padStart(2,'0')}:${String(minuteVal).padStart(2,'0')} ${genderVal} ${timeBranch}時(${calTypeVal==='lunar'?'農曆':'國曆'}${isLeapVal}) / ${bzStr}`;
    compareEl.innerHTML=`
      <div style="font-weight:800;color:var(--red);margin-bottom:10px;font-size:15px">🔍 和文墨天機一起輕鬆對對看 <span style="font-weight:400;font-size:11px;color:var(--muted)">— 完整詳細版</span></div>

      <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 12px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b style="font-size:13px">你這張盤的輸入</b>
          <span class="tag" style="background:var(--red);color:#fff;border-color:var(--red)">${esc(genderVal)}命</span>
          <span class="tag">${esc(calTypeVal==='lunar'?'農曆':'國曆')} ${esc(yearVal)}-${String(monthVal).padStart(2,'0')}-${String(dayVal).padStart(2,'0')} ${String(hourVal).padStart(2,'0')}:${String(minuteVal).padStart(2,'0')} ${esc(timeBranch)}時</span>
          <span class="tag">${esc(isLeapVal||'非閏月')}</span>
          <button id="copyBtn" class="btn btn-ghost" style="margin-left:auto;padding:4px 10px;font-size:11px">一鍵複製生日</button>
        </div>
        <div style="margin-top:6px;font-size:11px;line-height:1.7;color:var(--muted)">
          國曆對應：${esc(solarDateStr)} &nbsp; 農曆：${esc(lunarDateStr)} &nbsp; 八字：<b style="color:var(--red)">${esc(bzStr)}</b><br>
          命宮：<b>${mingPalace?esc(mingPalace.heavenlyStem+mingPalace.earthlyBranch):'—'}</b>（${mingPalace?esc(mingPalace.earthlyBranch):''}宮） &nbsp; 身宮在：<b>${esc(astrolabe.earthlyBranchOfBodyPalace||'') }</b> &nbsp; 時辰序號：<b>${timeIndex}</b>（${esc(timeBranch)}）
        </div>
        <div style="margin-top:6px;font-size:11px;color:var(--muted)">小提醒：早子(00)與晚子(12)都算當天，八字日柱由引擎自動處理；若和老師傅差一天，試試前後一天的日期。</div>
      </div>

      <div style="background:var(--paper);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px">
        <div style="padding:10px 12px;background:linear-gradient(to right,#fdf6e3,#fffef7);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <b style="color:var(--red);font-size:13px">① 12宮干支與主星對照表</b>
          <span style="font-size:11px;color:var(--muted)">依地支 寅→丑 順序，和文墨天機同一格對照</span>
          <span style="margin-left:auto;font-size:11px;color:var(--muted)">勾選打勾，會變綠色</span>
        </div>
        <div style="overflow:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:560px">
            <thead><tr style="background:#fdf6e3;color:var(--muted);font-size:11px"><th style="padding:6px;text-align:left">宮位</th><th style="padding:6px;text-align:center">干支</th><th style="padding:6px;text-align:left">主星(十四主星) <span style="font-weight:400">（亮度·白話）</span></th><th style="padding:6px;text-align:left">吉煞(輔星)</th><th style="padding:6px;text-align:left">雜曜(前3)</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
        <div style="padding:8px 12px;font-size:11px;color:var(--muted);background:#fffef7;border-top:1px dashed #f0e6cc">小撇步：滑鼠移到主星上會顯示白話個性；空宮會顯示「—（空宮）」，記得參考對宮和三方一起看。</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px">
        <div style="background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px">
          <div style="font-weight:800;color:var(--red);font-size:13px;margin-bottom:6px">② 生年四化怎麼對</div>
          <div style="font-size:12px;margin-bottom:6px">年干 <b style="color:var(--red)">${esc(yearlyStem)}</b> 的四化：${yearlyFour.map((s,i)=>`<span style="color:${MUTAGEN_COLOR[MUTAGEN_LABEL[i]]};font-weight:800">${esc(s)}${esc(MUTAGEN_LABEL[i])}</span>`).join('、') || '—'}</div>
          <div style="display:flex;flex-wrap:wrap">${yearlyFourRows || '<span style="font-size:11px;color:var(--muted)">—</span>'}</div>
          <div style="margin-top:8px;font-size:11px;line-height:1.7;color:var(--muted)">對法：文墨天機「生年四化」欄會標同樣四顆星與顏色，位置（宮位＋地支）要一模一樣才算對。飛星卡上的「祿→XX」就是這四顆星飛去的地方。</div>
        </div>
        <div style="background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px">
          <div style="font-weight:800;color:var(--red);font-size:13px;margin-bottom:6px">③ 時辰對照表</div>
          <div style="overflow:auto;max-height:220px">
            <table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#fdf6e3"><th>時辰</th><th>時間</th><th>序號</th><th>地支</th><th>備註</th></tr></thead><tbody>${timeTableRows}</tbody></table>
          </div>
          <div style="margin-top:6px;font-size:11px;color:var(--muted)">你這張：<b style="color:var(--red)">${esc(timeBranch)}時 序號${timeIndex}</b>，若對不上，試試前後1格（例如 未→申），命宮會跟著跑一格。</div>
        </div>
      </div>

      <div style="background:#fff;border:1.5px solid #fecaca;border-radius:12px;padding:12px;margin-bottom:12px">
        <div style="font-weight:800;color:#991b1b;font-size:13px;margin-bottom:6px">④ 對不上？先試這三步</div>
        <ol style="padding-left:18px;font-size:12px;line-height:1.9">
          <li><label style="cursor:pointer"><input type="checkbox" class="fix-step"> <b>前後1小時</b>：23:00/00:00 前後最容易差一宮，早子(00)與晚子(12)都算當天，試試前後1個時辰。</label></li>
          <li><label style="cursor:pointer"><input type="checkbox" class="fix-step"> <b>前後1天</b>：若八字日柱差一天，試試前後一天的日期（農曆閏月也檢查一下）。</label></li>
          <li><label style="cursor:pointer"><input type="checkbox" class="fix-step"> <b>曆法與閏月</b>：確認文墨天機選的是「國曆/農曆」與是否勾「閏月」，要和本頁一致（小月30日會提示）。</label></li>
        </ol>
        <div style="margin-top:6px;font-size:11px;color:var(--muted)">做完三步還對不上，把本頁的 <b>八字 ${esc(bzStr)}</b> 與 12宮干支截圖一起比對，通常就能找到差在哪一格。</div>
      </div>

      <div style="font-size:11px;color:var(--muted);background:#fffef7;border:1px solid #f0e6cc;border-radius:8px;padding:8px 10px">※ 排盤和文墨天機是同一顆引擎（iztro@2.5.1），放心對；「分數和運勢小語」是輕鬆版參考，看看就好，重要決定還是找信任的老師聊聊更安心。∣ 滑鼠輕輕放在飛星箭頭或宮位上，會同步高亮對應宮位。</div>
    `;
    // ── 互動：複製與勾選 ──
    const copyBtn=document.getElementById('copyBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', async()=>{
        try{ await navigator.clipboard.writeText(copyText); copyBtn.textContent='已複製！'; setTimeout(()=>copyBtn.textContent='一鍵複製生日',1500); }catch{ const ta=document.createElement('textarea'); ta.value=copyText; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); copyBtn.textContent='已複製！'; setTimeout(()=>copyBtn.textContent='一鍵複製生日',1500); }
      });
    }
    compareEl.querySelectorAll('.check-palace').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const tr=cb.closest('tr'); if(!tr) return;
        tr.style.background=cb.checked?'#f0fdf4':'';
        tr.style.opacity=cb.checked?'0.9':'1';
      });
    });
    // 點表格列也能高亮命盤對應宮位
    compareEl.querySelectorAll('tr[data-branch]').forEach(tr=>{
      tr.style.cursor='pointer';
      tr.addEventListener('mouseenter',()=>{
        const br=tr.dataset.branch;
        document.querySelectorAll('.palace[data-branch]').forEach(p=>{
          if(p.dataset.branch===br){ p.style.outline='2px solid var(--gold)'; p.style.boxShadow='0 0 0 3px rgba(201,168,106,.2)'; }
        });
      });
      tr.addEventListener('mouseleave',()=>{
        document.querySelectorAll('.palace[data-branch]').forEach(p=>{ p.style.outline=''; p.style.boxShadow=''; });
      });
    });
  }catch(e){
    el.innerHTML=`<div style="font-size:12px;color:#991b1b">飛星計算失敗：${esc(e.message)}</div>`;
  }
}

// 星曜 tooltip：手機點擊切換顯示，點擊空白處關閉
document.addEventListener('click', e=>{
  const t=e.target.closest('.star.has-tip');
  if(t){
    e.stopPropagation();
    document.querySelectorAll('.star.has-tip.show-tip').forEach(el=>{ if(el!==t) el.classList.remove('show-tip'); });
    t.classList.toggle('show-tip');
  } else {
    document.querySelectorAll('.star.has-tip.show-tip').forEach(el=>el.classList.remove('show-tip'));
  }
});
// auto calc sample on load for demo? not auto, wait user click
</script>
</body>
</html>

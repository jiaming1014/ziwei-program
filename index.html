<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>骰子模擬器</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    text-align: center;
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #3b4a6b 0%, #1e2540 45%, #12162b 100%);
    color: #fff;
  }
  .panel {
    background: rgba(255,255,255,0.96);
    color: #222;
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 24px 24px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 #fff;
  }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: 2px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 8px; }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin: 20px 0 8px;
    flex-wrap: wrap;
  }
  label { font-size: 17px; font-weight: bold; }
  select {
    font-size: 17px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 2px solid #ddd;
    background: #f8f8fa;
    outline: none;
  }
  select:focus { border-color: #4caf50; }
  button {
    font-size: 17px;
    font-weight: bold;
    padding: 10px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    letter-spacing: 2px;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s;
  }
  #startBtn { background: linear-gradient(180deg, #66bb6a, #2e7d32); box-shadow: 0 6px 16px rgba(46,125,50,.4); }
  #startBtn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.05); }
  #startBtn:disabled { background: #c8c8c8; box-shadow: none; cursor: not-allowed; }
  #pauseBtn { background: linear-gradient(180deg, #ffa726, #ef6c00); box-shadow: 0 6px 16px rgba(239,108,0,.4); }
  #pauseBtn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.05); }
  #pauseBtn:disabled { background: #e0c9a8; box-shadow: none; cursor: not-allowed; }
  #removeBtn { background: linear-gradient(180deg, #5c6bc0, #283593); box-shadow: 0 6px 16px rgba(40,53,147,.4); }
  #removeBtn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.05); }
  #removeBtn:disabled { background: #b9c0d8; box-shadow: none; cursor: not-allowed; }
  .controls.secondary { margin: 0 0 8px; }
  #diceContainer {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin: 22px 0 16px;
    min-height: 76px;
  }
  .dice {
    width: 68px;
    height: 68px;
    border-radius: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 11px;
    background: linear-gradient(145deg, #ffffff 0%, #ececf1 60%, #d7d7de 100%);
    box-shadow: 0 8px 18px rgba(0,0,0,.28), inset 0 2px 2px #fff, inset 0 -4px 8px rgba(0,0,0,.12);
  }
  .dice.black { border: 2px solid #23232a; }
  .dice.red { border: 2px solid #d32f2f; background: linear-gradient(145deg, #fff5f5 0%, #ffe0e0 60%, #f3b8b8 100%); }
  .pip {
    width: 68%;
    aspect-ratio: 1;
    border-radius: 50%;
    place-self: center;
    opacity: 0;
  }
  .pip.on { opacity: 1; }
  .black .pip.on { background: radial-gradient(circle at 32% 30%, #6a6a72, #0a0a0e 70%); box-shadow: 0 1px 2px rgba(0,0,0,.7), inset 0 1px 1px rgba(255,255,255,.35); }
  .red .pip.on { background: radial-gradient(circle at 32% 30%, #ff9a9a, #c62828 70%); box-shadow: 0 1px 2px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.5); }
  .rolling { animation: roll .14s infinite; }
  @keyframes roll {
    0% { transform: translateY(0) rotate(-12deg) scale(1); }
    50% { transform: translateY(-7px) rotate(10deg) scale(1.06); }
    100% { transform: translateY(0) rotate(-8deg) scale(1); }
  }
  .result {
    background: #f5f6fa;
    border-radius: 14px;
    padding: 14px 12px;
    margin-top: 6px;
  }
  #total { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
  #stat { font-size: 20px; margin-top: 8px; color: #444; min-height: 28px; }
  #colorStat { font-size: 20px; margin-top: 6px; font-weight: 900; min-height: 28px; }
</style>
</head>
<body>
<div class="panel">
  <h1>🎲 骰子模擬器</h1>
  <div class="sub">高畫質立體骰子 · 暫停即由大到小排序</div>

  <div class="controls">
    <label for="diceCount">選擇骰子數量：</label>
    <select id="diceCount">
      <option value="1">1 顆</option>
      <option value="2">2 顆</option>
      <option value="3">3 顆</option>
      <option value="4">4 顆</option>
      <option value="5" selected>5 顆</option>
      <option value="6">6 顆</option>
      <option value="7">7 顆</option>
      <option value="8">8 顆</option>
      <option value="9">9 顆</option>
      <option value="10">10 顆</option>
    </select>
    <button id="startBtn">開始</button>
    <button id="pauseBtn" disabled>暫停</button>
  </div>

  <div class="controls secondary">
    <label for="removeType">移除玩法：</label>
    <select id="removeType">
      <option value="red">移除紅</option>
      <option value="black">移除黑</option>
      <option value="odd">移除單</option>
      <option value="even">移除雙</option>
      <option value="big">移除大</option>
      <option value="small">移除小</option>
    </select>
    <button id="removeBtn">移除</button>
  </div>

  <div id="diceContainer"></div>
  <div class="result">
    <div id="total">總和：--</div>
    <div id="stat">--</div>
    <div id="colorStat">--</div>
  </div>
</div>

<script>
  const pipMap = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  const numZh = ['', '一', '二', '三', '四', '五', '六'];
  const isRed = (v) => v === 1 || v === 4;
  const isOdd = (v) => v % 2 === 1;
  const isEven = (v) => v % 2 === 0;
  const isBig = (v) => v >= 4;
  const isSmall = (v) => v <= 3;
  const diceCountEl = document.getElementById('diceCount');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const removeTypeEl = document.getElementById('removeType');
  const removeBtn = document.getElementById('removeBtn');
  const diceContainer = document.getElementById('diceContainer');
  const totalEl = document.getElementById('total');
  const statEl = document.getElementById('stat');
  const colorStatEl = document.getElementById('colorStat');

  let timer = null;
  let currentValues = [];

  function getStatText(values) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    values.forEach(v => { counts[v]++; });
    const parts = [];
    for (let face = 6; face >= 1; face--) {
      if (counts[face] > 0) {
        parts.push(counts[face] + '個' + numZh[face]);
      }
    }
    return parts.join('  ');
  }

  function getColorText(values) {
    const red = values.filter(isRed).length;
    const black = values.length - red;
    return red + '個紅' + black + '個黑';
  }

  function createDiceEl(v, isRolling, idx) {
    const d = document.createElement('div');
    d.className = 'dice ' + (isRed(v) ? 'red' : 'black') + (isRolling ? ' rolling' : '');
    if (isRolling) d.style.animationDelay = ((idx * 37) % 90) + 'ms';
    for (let i = 1; i <= 9; i++) {
      const s = document.createElement('span');
      s.className = 'pip' + (pipMap[v].includes(i) ? ' on' : '');
      d.appendChild(s);
    }
    return d;
  }

  function render(values, isRolling) {
    diceContainer.innerHTML = '';
    if (values.length === 0) {
      diceContainer.innerHTML = '<div style="color:#999;font-size:18px;padding:18px;">已全部移除</div>';
      totalEl.textContent = '總和：--';
      statEl.textContent = '--';
      colorStatEl.textContent = '--';
      return;
    }
    const display = isRolling ? values : [...values].sort((a, b) => b - a);
    display.forEach((v, idx) => diceContainer.appendChild(createDiceEl(v, isRolling, idx)));
    const sum = values.reduce((a, b) => a + b, 0);
    totalEl.textContent = '總和：' + sum;
    if (isRolling) {
      statEl.textContent = '🎲 搖動中...';
      colorStatEl.textContent = '🎲 搖動中...';
    } else {
      statEl.textContent = getStatText(values);
      colorStatEl.textContent = getColorText(values);
    }
  }

  function rollOnce() {
    const count = parseInt(diceCountEl.value, 10);
    currentValues = Array.from({length: count}, () => Math.floor(Math.random() * 6) + 1);
    render(currentValues, true);
  }

  startBtn.addEventListener('click', () => {
    if (timer) return;
    rollOnce();
    timer = setInterval(rollOnce, 110);
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    diceCountEl.disabled = true;
    removeBtn.disabled = true;
    removeTypeEl.disabled = true;
  });

  pauseBtn.addEventListener('click', () => {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    render(currentValues, false);
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    diceCountEl.disabled = false;
    removeBtn.disabled = false;
    removeTypeEl.disabled = false;
  });

  function shouldRemove(v) {
    const t = removeTypeEl.value;
    if (t === 'red') return isRed(v);
    if (t === 'black') return !isRed(v);
    if (t === 'odd') return isOdd(v);
    if (t === 'even') return isEven(v);
    if (t === 'big') return isBig(v);
    return isSmall(v);
  }

  removeBtn.addEventListener('click', () => {
    if (timer || currentValues.length === 0) return;
    currentValues = currentValues.filter(v => !shouldRemove(v));
    if (currentValues.length > 0) {
      diceCountEl.value = String(currentValues.length);
    }
    render(currentValues, false);
  });

  diceCountEl.addEventListener('change', () => {
    if (timer) return;
    const count = parseInt(diceCountEl.value, 10);
    currentValues = Array.from({length: count}, () => 6);
    render(currentValues, false);
    totalEl.textContent = '總和：--';
    statEl.textContent = '--';
    colorStatEl.textContent = '--';
  });

  currentValues = [6,6,6,6,6];
  render(currentValues, false);
  totalEl.textContent = '總和：--';
  statEl.textContent = '--';
  colorStatEl.textContent = '--';
</script>
</body>
</html>
